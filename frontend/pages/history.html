<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>History &amp; Activities &mdash; PDF Master AI</title>
  <meta name="description" content="Riwayat aktivitas pemrosesan dokumen dan penggunaan AI di PDF Master AI">

  <!-- FAVICON -->
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon.png">
  <link rel="apple-touch-icon" href="../assets/images/favicon.png">

  <style>
    :root {
      --bg: #07111f;
      --surface: #0c1424;
      --surface-2: #111c2e;
      --surface-3: #162338;
      --border: #1e293b;
      --border-light: #26364e;

      --text: #e2e8f0;
      --muted: #94a3b8;
      --muted-2: #64748b;

      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;

      --sidebar-width: 250px;
      --header-height: 72px;

      --radius: 14px;
      --max: 1200px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* HEADER */
    .dashboard-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-height);
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      background: rgba(7, 17, 31, .96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .site-logo {
      display: block;
      width: 150px;
      height: auto;
      max-height: 50px;
      object-fit: contain;
    }

    .mobile-menu {
      display: none;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 21px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 8px 5px 5px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: var(--surface-2);
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 14px;
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 110px;
    }

    .user-name {
      font-size: 13px;
      font-weight: 700;
    }

    .user-plan {
      color: var(--muted);
      font-size: 11px;
    }

    /* SIDEBAR */
    .sidebar {
      position: fixed;
      top: var(--header-height);
      left: 0;
      bottom: 0;

      width: var(--sidebar-width);

      background: var(--surface);
      border-right: 1px solid var(--border);

      padding: 24px 14px;

      overflow-y: auto;
      z-index: 900;
    }

    .sidebar-section {
      margin-bottom: 28px;
    }

    .sidebar-title {
      padding: 0 12px;
      margin-bottom: 9px;

      color: var(--muted-2);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .sidebar-link {
      width: 100%;

      display: flex;
      align-items: center;
      gap: 12px;

      padding: 11px 12px;
      margin: 3px 0;

      border: 1px solid transparent;
      border-radius: 10px;

      color: var(--muted);
      font-size: 14px;

      transition: .2s ease;
    }

    .sidebar-link:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    .sidebar-link.active {
      color: #fff;
      background: rgba(59, 130, 246, .13);
      border-color: rgba(59, 130, 246, .25);
    }

    .sidebar-icon {
      width: 22px;
      text-align: center;
      font-size: 16px;
    }

    .logout-link {
      color: #fca5a5;
    }

    .logout-link:hover {
      color: #fecaca;
      background: rgba(239, 68, 68, .08);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 850;
      background: rgba(0, 0, 0, .55);
    }

    /* MAIN CONTENT */
    .dashboard-main {
      margin-left: var(--sidebar-width);
      padding-top: var(--header-height);
      min-height: 100vh;
    }

    .dashboard-content {
      width: min(100% - 48px, var(--max));
      margin: auto;
      padding: 38px 0 70px;
    }

    .page-header-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 28px;
    }

    .page-title-box h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .page-title-box p {
      color: var(--muted);
      font-size: 14px;
    }

    .btn-clear-all {
      padding: 10px 18px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      transition: .2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-clear-all:hover {
      background: rgba(239, 68, 68, 0.22);
      color: #fecaca;
    }

    /* FILTER BAR */
    .filter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 24px;

      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .search-box-wrapper {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      outline: none;
      transition: border-color .2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 15px;
      pointer-events: none;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 10px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      outline: none;
      cursor: pointer;
      font-size: 13px;
    }

    .filter-select:focus {
      border-color: var(--primary);
    }

    /* HISTORY LIST */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      transition: .2s ease;
    }

    .history-card:hover {
      border-color: var(--border-light);
      transform: translateY(-2px);
    }

    .history-info-group {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      min-width: 0;
    }

    .activity-icon-badge {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--surface-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .history-details {
      min-width: 0;
    }

    .history-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-filename {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      word-break: break-all;
    }

    .history-time {
      font-size: 11px;
      color: var(--muted-2);
    }

    .history-actions-group {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    /* STATUS BADGES */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    .status-badge.success {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #86efac;
    }

    .status-badge.failed {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    .status-badge.processing {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.25);
      color: #fde047;
    }

    .btn-delete-item {
      background: transparent;
      border: none;
      color: var(--muted-2);
      font-size: 16px;
      padding: 6px;
      border-radius: 8px;
      transition: .2s ease;
    }

    .btn-delete-item:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.08);
    }

    /* STATES CONTAINER */
    .state-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 50px 24px;
      text-align: center;
      margin-top: 10px;
    }

    .state-icon {
      font-size: 42px;
      margin-bottom: 12px;
      display: block;
    }

    .state-box h3 {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .state-box p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .btn-action-primary {
      padding: 10px 20px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      display: inline-block;
      transition: background .2s;
    }

    .btn-action-primary:hover {
      background: var(--primary-hover);
    }

    /* SKELETON LOADING */
    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .skeleton-circle {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--surface-3);
      animation: pulse 1.5s infinite ease-in-out;
    }

    .skeleton-lines {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .skeleton-line {
      height: 12px;
      border-radius: 6px;
      background: var(--surface-3);
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    /* PAGINATION */
    .pagination-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    .pagination-btns {
      display: flex;
      gap: 8px;
    }

    .btn-page {
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .btn-page:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-page:not(:disabled):hover {
      border-color: var(--border-light);
      background: var(--surface-2);
    }

    /* FOOTER */
    footer {
      margin-left: var(--sidebar-width);
      background: #0c1424;
      border-top: 1px solid var(--border);
    }

    .footer-bottom {
      padding: 22px 24px;
      color: #64748b;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 820px) {
      .mobile-menu { display: flex; }
      .sidebar { transform: translateX(-100%); transition: transform .25s ease; }
      .sidebar.is-open { transform: translateX(0); }
      .sidebar-overlay.is-open { display: block; }
      .dashboard-main, footer { margin-left: 0; }

      .page-header-container {
        flex-direction: column;
        align-items: flex-start;
      }

      .history-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .history-actions-group {
        width: 100%;
        justify-content: space-between;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
    }
  </style>
</head>

<body>

<header class="dashboard-header">
  <div class="header-left">
    <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">&#9776;</button>
    <a href="/pages/dashboard.html" class="brand-logo" aria-label="PDF Master AI - Home">
      <img src="../assets/images/logo.png" alt="PDF Master AI" class="site-logo" width="150" height="50">
    </a>
  </div>

  <div class="header-right">
    <div class="user-menu">
      <div class="avatar" id="headerAvatar">U</div>
      <div class="user-info">
        <div class="user-name" id="headerUserName">User</div>
        <div class="user-plan" id="headerUserPlan">FREE Plan</div>
      </div>
    </div>
  </div>
</header>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-section">
    <div class="sidebar-title">Workspace</div>
    <a href="/pages/dashboard.html" class="sidebar-link"><span class="sidebar-icon">&#8962;</span><span>Dashboard</span></a>
    <a href="/pages/tools/all-tools.html" class="sidebar-link"><span class="sidebar-icon">&#128190;</span><span>PDF Tools</span></a>
    <a href="/pages/dashboard.html#ai" class="sidebar-link"><span class="sidebar-icon">&#10024;</span><span>AI Tools</span></a>
    <a href="/pages/history.html" class="sidebar-link active"><span class="sidebar-icon">&#128340;</span><span>History</span></a>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-title">Account</div>
    <a href="/pages/profile.html" class="sidebar-link"><span class="sidebar-icon">&#128100;</span><span>Profile</span></a>
    <a href="/pages/settings.html" class="sidebar-link"><span class="sidebar-icon">&#9881;</span><span>Settings</span></a>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-title">Support</div>
    <a href="/pages/faq.html" class="sidebar-link"><span class="sidebar-icon">&#10068;</span><span>Help Center</span></a>
    <a href="#" class="sidebar-link logout-link" id="logoutButton"><span class="sidebar-icon">&#8617;</span><span>Logout</span></a>
  </div>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<main class="dashboard-main">
  <div class="dashboard-content">

    <div class="page-header-container">
      <div class="page-title-box">
        <h1>History</h1>
        <p>Lihat semua aktivitas dan dokumen yang pernah Anda proses.</p>
      </div>
      <button class="btn-clear-all" id="btnClearAll" style="display: none;">
        <span>&#128465;</span> Hapus Semua
      </button>
    </div>

    <!-- FILTER & SEARCH BAR -->
    <div class="filter-card">
      <div class="search-box-wrapper">
        <span class="search-icon">&#128099;</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Cari judul, nama file, atau tipe aktivitas...">
      </div>

      <div class="controls-right">
        <select id="filterType" class="filter-select">
          <option value="all">Semua Tipe</option>
          <option value="pdf">PDF Tools</option>
          <option value="ai">AI Tools</option>
          <option value="success">Berhasil</option>
          <option value="failed">Gagal</option>
        </select>

        <select id="sortOrder" class="filter-select">
          <option value="newest">Terbaru</option>
          <option value="oldest">Terlama</option>
        </select>
      </div>
    </div>

    <!-- MAIN HISTORY CONTAINER -->
    <div id="historyContainer"></div>

    <!-- PAGINATION CONTAINER -->
    <div class="pagination-container" id="paginationContainer" style="display: none;">
      <div id="paginationInfo">Menampilkan 0 dari 0 item</div>
      <div class="pagination-btns">
        <button class="btn-page" id="btnPrevPage" disabled>Prev</button>
        <button class="btn-page" id="btnNextPage" disabled>Next</button>
      </div>
    </div>

  </div>
</main>

<footer>
  <div class="footer-bottom">
    <div>&copy; 2026 <strong>PDF Master AI</strong>. All rights reserved.</div>
    <div>Smart PDF Workspace</div>
  </div>
</footer>

<script>
  (() => {
    // 1. KONFIGURASI UTAMA
    const API_BASE_URL = 'https://messenger-applying-senators-conduct.trycloudflare.com';
    const ITEMS_PER_PAGE = 10;

    // State Internal
    let rawHistoryData = [];
    let filteredHistoryData = [];
    let currentPage = 1;

    // DOM Elements
    const mobileMenu = document.getElementById('mobileMenu');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    const historyContainer = document.getElementById('historyContainer');
    const searchInput = document.getElementById('searchInput');
    const filterType = document.getElementById('filterType');
    const sortOrder = document.getElementById('sortOrder');
    const btnClearAll = document.getElementById('btnClearAll');

    const paginationContainer = document.getElementById('paginationContainer');
    const paginationInfo = document.getElementById('paginationInfo');
    const btnPrevPage = document.getElementById('btnPrevPage');
    const btnNextPage = document.getElementById('btnNextPage');

    const headerUserName = document.getElementById('headerUserName');
    const headerUserPlan = document.getElementById('headerUserPlan');
    const headerAvatar = document.getElementById('headerAvatar');

    // Toggle Mobile Sidebar
    function closeSidebar() {
      if (sidebar) sidebar.classList.remove('is-open');
      if (sidebarOverlay) sidebarOverlay.classList.remove('is-open');
    }

    if (mobileMenu) {
      mobileMenu.addEventListener('click', () => {
        sidebar.classList.toggle('is-open');
        sidebarOverlay.classList.toggle('is-open');
      });
    }

    if (sidebarOverlay) {
      sidebarOverlay.addEventListener('click', closeSidebar);
    }

    // Map Icon Berdasarkan Jenis Aktivitas (Menggunakan Entity Unicode Aman)
    function getActivityIcon(type) {
      const typeLower = (type || '').toLowerCase();
      if (typeLower.includes('word')) return '&#128196;';
      if (typeLower.includes('merge')) return '&#128193;';
      if (typeLower.includes('compress')) return '&#128451;';
      if (typeLower.includes('image')) return '&#128444;';
      if (typeLower.includes('ppt')) return '&#128202;';
      if (typeLower.includes('excel')) return '&#128200;';
      if (typeLower.includes('ai')) return '&#129302;';
      return '&#128194;';
    }

    // Format Tanggal yang Ramah
    function formatDate(dateString) {
      if (!dateString) return 'Waktu tidak diketahui';
      try {
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return dateString;
        
        return new Intl.DateTimeFormat('id-ID', {
          day: 'numeric',
          month: 'long',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }).format(date);
      } catch (e) {
        return dateString;
      }
    }

    // Load Profil Header dari Backend
    async function loadHeaderProfile() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/profile/`);
        if (!response.ok) return;

        const data = await response.json();
        const name = data.name || 'User';
        const plan = data.plan || 'FREE';
        const firstLetter = name.charAt(0).toUpperCase();

        if (headerUserName) headerUserName.textContent = name;
        if (headerUserPlan) headerUserPlan.textContent = `${plan} Plan`;

        if (data.avatar_url && headerAvatar) {
          const fullAvatarUrl = data.avatar_url.startsWith('http')
            ? data.avatar_url
            : `${API_BASE_URL}${data.avatar_url}?t=${new Date().getTime()}`;

          headerAvatar.style.backgroundImage = `url('${fullAvatarUrl}')`;
          headerAvatar.textContent = '';
        } else if (headerAvatar) {
          headerAvatar.style.backgroundImage = 'none';
          headerAvatar.textContent = firstLetter;
        }
      } catch (err) {
        console.error('Error loading header profile:', err);
      }
    }

    // Loading State (Skeleton)
    function showLoading() {
      historyContainer.innerHTML = Array(3).fill(0).map(() => `
        <div class="skeleton-card">
          <div class="skeleton-circle"></div>
          <div class="skeleton-lines">
            <div class="skeleton-line" style="width: 40%;"></div>
            <div class="skeleton-line" style="width: 25%;"></div>
            <div class="skeleton-line" style="width: 20%;"></div>
          </div>
        </div>
      `).join('');
      paginationContainer.style.display = 'none';
    }

    // Empty State
    function showEmptyState() {
      historyContainer.innerHTML = `
        <div class="state-box">
          <span class="state-icon">&#128194;</span>
          <h3>Belum ada aktivitas</h3>
          <p>Aktivitas pemrosesan dokumen dan penggunaan AI Anda akan muncul di sini.</p>
          <a href="/pages/tools/all-tools.html" class="btn-action-primary">Mulai Menggunakan Tools</a>
        </div>
      `;
      btnClearAll.style.display = 'none';
      paginationContainer.style.display = 'none';
    }

    // Error State
    function showError() {
      historyContainer.innerHTML = `
        <div class="state-box">
          <span class="state-icon">&#9888;</span>
          <h3>Tidak dapat memuat riwayat</h3>
          <p>Pastikan server backend sedang berjalan dan coba lagi.</p>
          <button class="btn-action-primary" id="btnRetry">Coba Lagi</button>
        </div>
      `;
      btnClearAll.style.display = 'none';
      paginationContainer.style.display = 'none';

      document.getElementById('btnRetry')?.addEventListener('click', loadHistory);
    }

    // Render Data History
    function renderHistory() {
      if (!filteredHistoryData || filteredHistoryData.length === 0) {
        showEmptyState();
        return;
      }

      btnClearAll.style.display = 'inline-flex';

      // Hitung Pagination
      const totalItems = filteredHistoryData.length;
      const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
      if (currentPage > totalPages) currentPage = totalPages || 1;

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, totalItems);
      const currentItems = filteredHistoryData.slice(startIndex, endIndex);

      // Render Cards Aman dari XSS
      const listElement = document.createElement('div');
      listElement.className = 'history-list';

      currentItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'history-card';

        const icon = getActivityIcon(item.type || item.title);
        const titleText = item.title || item.type || 'Pemrosesan Dokumen';
        const filenameText = item.filename || 'Tanpa nama file';
        const dateText = formatDate(item.created_at);

        // Map status
        let statusClass = 'success';
        let statusIcon = '&#10003;';
        let statusText = 'Berhasil';

        if (item.status === 'failed') {
          statusClass = 'failed';
          statusIcon = '&#10005;';
          statusText = 'Gagal';
        } else if (item.status === 'processing') {
          statusClass = 'processing';
          statusIcon = '&#8635;';
          statusText = 'Diproses';
        }

        card.innerHTML = `
          <div class="history-info-group">
            <div class="activity-icon-badge">${icon}</div>
            <div class="history-details">
              <div class="history-title"></div>
              <div class="history-filename"></div>
              <div class="history-time"></div>
            </div>
          </div>
          <div class="history-actions-group">
            <span class="status-badge ${statusClass}">
              <span>${statusIcon}</span>
              <span>${statusText}</span>
            </span>
            <button class="btn-delete-item" title="Hapus riwayat ini">&#128465;</button>
          </div>
        `;

        // Sanitasi xss
        card.querySelector('.history-title').textContent = titleText;
        card.querySelector('.history-filename').textContent = filenameText;
        card.querySelector('.history-time').textContent = dateText;

        // Delete per item
        card.querySelector('.btn-delete-item').addEventListener('click', () => {
          deleteHistoryItem(item.id);
        });

        listElement.appendChild(card);
      });

      historyContainer.innerHTML = '';
      historyContainer.appendChild(listElement);

      // Update Pagination Controls
      if (totalItems > ITEMS_PER_PAGE) {
        paginationContainer.style.display = 'flex';
        paginationInfo.textContent = `Menampilkan ${startIndex + 1}-${endIndex} dari ${totalItems} item`;
        btnPrevPage.disabled = currentPage === 1;
        btnNextPage.disabled = currentPage === totalPages;
      } else {
        paginationContainer.style.display = 'none';
      }
    }

    // Filter, Search, & Sort
    function applyFilterAndSort() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const selectedType = filterType.value;
      const selectedSort = sortOrder.value;

      filteredHistoryData = rawHistoryData.filter(item => {
        const matchesSearch = 
          (item.title || '').toLowerCase().includes(searchTerm) ||
          (item.filename || '').toLowerCase().includes(searchTerm) ||
          (item.type || '').toLowerCase().includes(searchTerm);

        let matchesType = true;
        if (selectedType === 'pdf') {
          matchesType = !(item.type || '').toLowerCase().includes('ai');
        } else if (selectedType === 'ai') {
          matchesType = (item.type || '').toLowerCase().includes('ai');
        } else if (selectedType === 'success') {
          matchesType = item.status === 'success';
        } else if (selectedType === 'failed') {
          matchesType = item.status === 'failed';
        }

        return matchesSearch && matchesType;
      });

      // Sorting
      filteredHistoryData.sort((a, b) => {
        const dateA = new Date(a.created_at || 0).getTime();
        const dateB = new Date(b.created_at || 0).getTime();
        return selectedSort === 'oldest' ? dateA - dateB : dateB - dateA;
      });

      currentPage = 1;
      renderHistory();
    }

    // Fetch GET /api/history
    async function loadHistory() {
      showLoading();
      try {
        const response = await fetch(`${API_BASE_URL}/api/history`);
        if (!response.ok) {
          throw new Error('Gagal memuat riwayat dari server.');
        }

        const data = await response.json();
        rawHistoryData = Array.isArray(data) ? data : (data.history || []);
        applyFilterAndSort();
      } catch (error) {
        console.error('Error fetching history:', error);
        showError();
      }
    }

    // Delete Per Item DELETE /api/history/{id}
    async function deleteHistoryItem(id) {
      if (!confirm('Apakah Anda yakin ingin menghapus riwayat aktivitas ini?')) return;

      try {
        const response = await fetch(`${API_BASE_URL}/api/history/${id}`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          throw new Error('Gagal menghapus item riwayat.');
        }

        // Hapus dari state lokal dan re-render
        rawHistoryData = rawHistoryData.filter(item => item.id !== id);
        applyFilterAndSort();
      } catch (error) {
        console.error('Error deleting item:', error);
        alert(error.message || 'Gagal menghapus item riwayat.');
      }
    }

    // Delete All DELETE /api/history
    async function deleteAllHistory() {
      if (!confirm('Apakah Anda yakin ingin MENGHAPUS SEMUA riwayat aktivitas? Tindakan ini tidak dapat dibatalkan.')) return;

      try {
        const response = await fetch(`${API_BASE_URL}/api/history`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          throw new Error('Gagal menghapus semua riwayat.');
        }

        rawHistoryData = [];
        applyFilterAndSort();
      } catch (error) {
        console.error('Error deleting all history:', error);
        alert(error.message || 'Gagal menghapus seluruh riwayat.');
      }
    }

    // Event Listeners Controls
    searchInput.addEventListener('input', applyFilterAndSort);
    filterType.addEventListener('change', applyFilterAndSort);
    sortOrder.addEventListener('change', applyFilterAndSort);
    btnClearAll.addEventListener('click', deleteAllHistory);

    btnPrevPage.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderHistory();
      }
    });

    btnNextPage.addEventListener('click', () => {
      const totalPages = Math.ceil(filteredHistoryData.length / ITEMS_PER_PAGE);
      if (currentPage < totalPages) {
        currentPage++;
        renderHistory();
      }
    });

    // Logout Handler
    document.getElementById('logoutButton')?.addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('mr_pdf_user');
      window.location.href = '/pages/login.html';
    });

    // Inisialisasi
    loadHeaderProfile();
    loadHistory();
  })();
</script>

</body>
</html>
